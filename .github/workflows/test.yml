name: test

# Builds the compiler from the committed seed, checks the self-host fixpoint,
# and runs tests/run_tests.sh against tests/known_failures.txt. A failure
# that is not on that list fails the job.

on:
  push:
    branches: [claude/nova-language-design-dZn3q]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          as --version | head -1
          ld --version | head -1

      # No setarch: the seed is a tagged-compiler build, so the bootstrap is
      # not ASLR-dependent any more.
      - name: Build compiler (seed -> stage1 -> stage2)
        run: make bin/nova

      - name: Self-host fixpoint (stage2 == stage3)
        run: make self-host

      # The seed only has to be able to build the current compiler; it does
      # not have to be the newest stage2. Report (do not fail) when it lags,
      # so a reseed (scripts/reseed.sh) can be scheduled.
      - name: Seed freshness (informational)
        run: |
          if cmp -s boot/nova_boot.s /tmp/nova_stage2.s; then
            echo "seed == stage2"
          else
            echo "::warning::boot/nova_boot.s differs from the current stage2 output; run scripts/reseed.sh in a separate PR when convenient"
          fi

      - name: Compiled-in version matches VERSION
        run: bash scripts/check_version.sh

      - name: Test suite against known failures
        run: bash scripts/check_test_baseline.sh

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  # Original tarball-only matrix: cross-compiles every target from
  # ubuntu-latest. Kept untouched so existing release consumers (the
  # `install.sh` one-liner, the Homebrew formula) keep working.
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            artifact: nova
            tar_name: nova-linux-x86_64.tar.gz
          - target: windows-x86_64
            artifact: nova.exe
            tar_name: nova-windows-x86_64.tar.gz
          - target: macos-x86_64
            artifact: nova_macos.o
            tar_name: nova-macos-x86_64.tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils build-essential
          if [ "${{ matrix.target }}" = "windows-x86_64" ]; then
            sudo apt-get install -y mingw-w64
          fi
          if [ "${{ matrix.target }}" = "macos-x86_64" ]; then
            sudo apt-get install -y clang
          fi

      - name: Bootstrap (build stage1 nova on Linux)
        run: |
          make bootstrap
          make bin/nova

      - name: Build Linux artifact
        if: matrix.target == 'linux-x86_64'
        run: |
          mkdir -p dist
          cp bin/nova dist/nova

      - name: Cross-build Windows artifact
        if: matrix.target == 'windows-x86_64'
        run: |
          mkdir -p dist
          make cross-windows
          cp bin/nova.exe dist/nova.exe

      - name: Cross-build macOS object artifact
        if: matrix.target == 'macos-x86_64'
        run: |
          mkdir -p dist
          make cross-macos
          clang -target x86_64-apple-darwin -c bin/nova_macos.s -o dist/nova_macos.o
          cp bin/nova_macos.s dist/nova_macos.s

      - name: Stage release tree
        run: |
          mkdir -p staging/nova
          cp dist/${{ matrix.artifact }} staging/nova/
          cp README.md INSTALL.md LICENSE staging/nova/ 2>/dev/null || true
          tar -C staging -czf ${{ matrix.tar_name }} nova
          ls -la ${{ matrix.tar_name }}
          sha256sum ${{ matrix.tar_name }} > ${{ matrix.tar_name }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ matrix.tar_name }}
            ${{ matrix.tar_name }}.sha256

  # Native-OS packaging matrix: builds .deb / .pkg / .msi on the OS
  # they target. Runs in parallel with the cross-build matrix above
  # and never blocks the tarball release (each native runner is a
  # best-effort soft-dependency).
  package:
    name: Package ${{ matrix.os }} (${{ matrix.format }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu
            runner: ubuntu-latest
            format: deb
          - os: macos
            runner: macos-latest
            format: pkg
          - os: windows
            runner: windows-latest
            format: msi
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------------------------------------- Ubuntu .deb
      - name: Install Linux toolchain
        if: matrix.os == 'ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils build-essential dpkg-dev

      - name: Bootstrap nova (Linux host)
        if: matrix.os == 'ubuntu'
        run: |
          make bootstrap
          make bin/nova
          bin/nova --version

      - name: Build .deb
        if: matrix.os == 'ubuntu'
        run: |
          bash scripts/build-deb.sh
          ls -la dist/*.deb
          dpkg-deb --info dist/nova_*_amd64.deb
          dpkg-deb --contents dist/nova_*_amd64.deb

      # ----------------------------------------------------------- macOS .pkg
      - name: Bootstrap nova (macOS host)
        if: matrix.os == 'macos'
        run: |
          # macOS ships `as`/`ld`/`clang` in Xcode CLT. The Makefile's
          # bootstrap target uses `as`+`ld` which work natively here.
          make bootstrap
          make bin/nova
          bin/nova --version

      - name: Build .pkg
        if: matrix.os == 'macos'
        env:
          # Productsign + notarization credentials. Both blocks are
          # no-ops if the secrets aren't configured -- the build-pkg.sh
          # script falls through to producing an unsigned .pkg in that
          # case, which is still useful for testing.
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOVA_APPLE_ID: ${{ secrets.NOVA_APPLE_ID }}
          NOVA_TEAM_ID: ${{ secrets.NOVA_TEAM_ID }}
          NOVA_APPLE_PWD: ${{ secrets.NOVA_APPLE_PWD }}
        run: |
          bash scripts/build-pkg.sh
          ls -la dist/*.pkg || true

      # ----------------------------------------------------------- Windows .msi
      - name: Set up Windows toolchain
        if: matrix.os == 'windows'
        run: |
          choco install make --no-progress -y
          choco install wixtoolset --no-progress -y
          choco install mingw      --no-progress -y
        shell: pwsh

      - name: Bootstrap nova (Windows cross-build via WSL/git-bash)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          # The windows-latest runner ships a bash + binutils via
          # git-bash; that's enough to run the existing two-stage build
          # under the mingw-w64 toolchain installed above.
          export PATH="/c/Program Files/Git/usr/bin:$PATH"
          make bootstrap
          make bin/nova
          make cross-windows
          ls -la bin/nova.exe

      - name: Build .msi
        if: matrix.os == 'windows'
        shell: cmd
        run: |
          packaging\windows\build-msi.bat
          dir dist\*.msi

      # ----------------------------------------------------------- upload
      - name: Upload .deb
        if: matrix.os == 'ubuntu'
        uses: actions/upload-artifact@v4
        with:
          name: nova-deb
          path: dist/*.deb

      - name: Upload .pkg
        if: matrix.os == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: nova-pkg
          path: |
            dist/*.pkg
            dist/*.pkg.txt

      - name: Upload .msi
        if: matrix.os == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: nova-msi
          path: dist/*.msi

  # Publish: gathers every artifact from `build` AND `package` into one
  # GitHub Release. Soft-depends on `package` -- if a native runner
  # fails, the tarballs still ship.
  release:
    name: Publish release
    needs: [build, package]
    if: |
      always() && needs.build.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find release-artifacts -type f \
            \( -name "*.tar.gz" -o -name "*.sha256" \
               -o -name "*.deb"  -o -name "*.pkg"  -o -name "*.msi" \) \
            -exec cp {} release/ \;
          ls -la release/

      - name: Resolve tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Nova ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: |
            release/*.tar.gz
            release/*.sha256
            release/*.deb
            release/*.pkg
            release/*.msi

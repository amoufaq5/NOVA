[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-dap"
version = "0.1.0"
description = "Debug Adapter Protocol implementation for the Nova programming language (gdb MI3 bridge)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Nova Language Authors" }]
keywords = ["nova", "dap", "debug-adapter-protocol", "gdb"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Debuggers",
  "Programming Language :: Python :: 3",
]

[project.scripts]
nova-dap = "nova_dap.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nova_dap*"]

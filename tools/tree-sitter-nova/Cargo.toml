[package]
name = "tree-sitter-nova"
description = "tree-sitter grammar for the NOVA programming language"
version = "0.1.0"
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "nova"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/nova-lang/nova"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = ["bindings/rust/*", "grammar.js", "queries/*", "src/*"]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter = ">=0.22.6"

[build-dependencies]
cc = "1.0.87"
